<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser AI Bridge</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #16213e;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
    }

    .status-dot.connected {
      background: #4CAF50;
    }

    .status-dot.error {
      background: #f44336;
    }

    .provider-info {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .provider-info h3 {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 8px;
    }

    .provider-name {
      font-size: 16px;
      font-weight: 600;
      color: #4fc3f7;
    }

    .chat-section {
      margin-bottom: 16px;
    }

    .chat-section h3 {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 8px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group input {
      flex: 1;
      padding: 10px 12px;
      background: #16213e;
      border: 1px solid #333;
      border-radius: 6px;
      color: #eee;
      font-size: 14px;
    }

    .input-group input:focus {
      outline: none;
      border-color: #4fc3f7;
    }

    .input-group button {
      padding: 10px 16px;
      background: #4fc3f7;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .input-group button:hover {
      background: #81d4fa;
    }

    .input-group button:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }

    .response-area {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      min-height: 100px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .response-area.empty {
      color: #666;
      font-style: italic;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
      padding: 8px;
      background: #16213e;
      border: 1px solid #333;
      border-radius: 6px;
      color: #eee;
      font-size: 12px;
      cursor: pointer;
    }

    .actions button:hover {
      background: #1a1a2e;
      border-color: #4fc3f7;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Browser AI Bridge</h1>
  </div>

  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Checking connection...</span>
  </div>

  <div class="provider-info">
    <h3>Current Provider</h3>
    <div class="provider-name" id="providerName">Detecting...</div>
  </div>

  <div class="chat-section">
    <h3>Quick Chat</h3>
    <div class="input-group">
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button id="sendButton">Send</button>
    </div>
  </div>

  <div class="response-area empty" id="responseArea">
    Response will appear here...
  </div>

  <div class="actions">
    <button id="extractBtn">Extract Response</button>
    <button id="clearBtn">Clear</button>
  </div>

  <div class="footer">
    Browser AI Bridge v0.4.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
